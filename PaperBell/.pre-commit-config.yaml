exclude: .obsidian/.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v6.0.0'
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: 'v0.43.0'
  hooks:
  - id: markdownlint
    args: ["-c", ".markdownlint.json"]
  - id: markdownlint-fix
    args: ["-c", ".markdownlint.json"]
